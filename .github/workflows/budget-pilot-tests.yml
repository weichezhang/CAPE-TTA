name: Budget pilot CPU software checks
on:
  push:
    paths:
      - 'src/cape_tta/budget_pilot.py'
      - 'scripts/*cached_pilot.py'
      - 'tests/test_budget_pilot.py'
      - '.github/workflows/budget-pilot-tests.yml'
  workflow_dispatch:
jobs:
  software-only:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m py_compile scripts/build_cached_pilot.py scripts/evaluate_cached_pilot.py
