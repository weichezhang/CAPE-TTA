name: OpenVLA checkpoint preflight

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/openvla_checkpoint_preflight.py'
      - '.github/workflows/openvla-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned OpenVLA metadata dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.0 torchvision==0.17.0
          pip install transformers==4.40.1 tokenizers==0.19.1 timm==0.9.10 pillow==10.3.0
      - name: Validate official LIBERO-Spatial checkpoint
        run: |
          python scripts/openvla_checkpoint_preflight.py             --checkpoint openvla/openvla-7b-finetuned-libero-spatial             --suite libero_spatial
